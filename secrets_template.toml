# =====================================================================
# Momira Travel Platform — Streamlit Cloud Secrets template
# Paste this into: your app on share.streamlit.io -> Settings -> Secrets
# Fill in the real values, delete the comment lines if you like, then Save.
# Streamlit secrets use TOML format - keep the quotes around values.
# =====================================================================

# ---------------------------------------------------------------------
# 1) TRAVEL COMPOSITOR — REQUIRED. Without these the app can't create
#    or read anything. Get these from whoever manages your Travel
#    Compositor / Momira Travel backoffice account.
# ---------------------------------------------------------------------
TRAVELC_USERNAME = ""
TRAVELC_PASSWORD = ""
TRAVELC_MICROSITE_ID = "momiratravel"          # only change if yours is different
TRAVELC_BASE_URL = "https://online.travelcompositor.com/resources"  # leave as-is unless TC told you otherwise
TRAVELC_SUPPLIER_ID = ""                       # numeric supplier id, used by the Translation Sync tool

# ---------------------------------------------------------------------
# 2) ANTHROPIC — REQUIRED. Powers every AI extraction/clarify call.
#    Get a key at: https://console.anthropic.com  (Settings -> API Keys)
# ---------------------------------------------------------------------
ANTHROPIC_API_KEY = ""
ANTHROPIC_MODEL = ""                           # optional - leave blank to use the app's default

# ---------------------------------------------------------------------
# 3) DATABASE — STRONGLY RECOMMENDED. Without this, translations and
#    route/id matches are lost every time Streamlit Cloud redeploys.
#    Get a free/cheap Postgres from Supabase, Neon, Railway, or Render.
#    Format: postgresql://USER:PASSWORD@HOST:PORT/DBNAME
# ---------------------------------------------------------------------
DATABASE_URL = ""

# ---------------------------------------------------------------------
# 4) IMAGE HOSTING (R2) — REQUIRED for uploading document-extracted images to
#    Travel Compositor (it only accepts an image URL, never raw bytes). Your
#    own private Cloudflare R2 bucket - see r2_client.py's module docstring
#    for the one-time Cloudflare setup (create account, create bucket,
#    generate API token, find Account ID, set a lifecycle auto-expiry rule).
# ---------------------------------------------------------------------
R2_ACCOUNT_ID = ""
R2_ACCESS_KEY_ID = ""
R2_SECRET_ACCESS_KEY = ""
R2_BUCKET_NAME = ""
R2_PUBLIC_BASE_URL = ""                        # e.g. "https://pub-xxxxxxxx.r2.dev" (no trailing slash)

# ---------------------------------------------------------------------
# 5) IMAGE SEARCH — used by the stock-photo picker when building a
#    Ticket/Tour/Transfer. App still works without these, just without
#    that image source.
#    Pexels:   https://www.pexels.com/api/          (free)
#    Pixabay:  https://pixabay.com/api/docs/         (free)
# ---------------------------------------------------------------------
PEXELS_API_KEY = ""
PIXABAY_API_KEY = ""

# ---------------------------------------------------------------------
# 6) TRANSLATION SYNC TOOL — only needed if you use that tab.
#    TRANSLATION_PROVIDER: "gemini" (cheaper, default) or "claude"
#    Gemini key: https://aistudio.google.com/apikey
# ---------------------------------------------------------------------
TRANSLATION_PROVIDER = "gemini"
GEMINI_API_KEY = ""
GEMINI_MODEL = ""                              # optional - leave blank for the app's default
TC_TARGET_LANGUAGES = ""                       # e.g. "DE,FR,ES" - which languages to translate into

# ---------------------------------------------------------------------
# 7) SUPPLIER DISCOVERY & OUTREACH TOOL — only needed if you use that
#    tab. Needs ONE search provider and ONE email provider (pick one
#    from each pair below - not both required).
# ---------------------------------------------------------------------
# --- search (pick one, or set TAVILY_API_KEY/SERPAPI_API_KEY plus the GEMINI_API_KEY above
#     for automatic fallback - see below) ---
# Tavily:  https://tavily.com                    (free tier)
# SerpAPI: https://serpapi.com                    (free tier, 250 searches/month, no card)
TAVILY_API_KEY = ""
SERPAPI_API_KEY = ""
# Automatic fallback (2026-08-25): if TAVILY_API_KEY (or SERPAPI_API_KEY, when Tavily isn't
# set) fails on a search - an expired key, a rate limit, or a plan usage limit like Tavily's -
# the search automatically retries with Gemini's "Grounding with Google Search" instead, using
# the SAME GEMINI_API_KEY already set above for the Translation Sync Tool. No separate key
# needed. Gemini 2.5 Flash's free tier includes this, free up to 500 requests/day, no credit
# card required (https://aistudio.google.com/apikey). Leave GEMINI_API_KEY blank above to skip
# this fallback entirely - Tavily/SerpAPI failures then behave exactly as before.

# --- email sending (pick one) ---
# Resend (recommended, simpler): https://resend.com
RESEND_API_KEY = ""
# OR plain SMTP (fallback, used only if RESEND_API_KEY is not set):
SMTP_HOST = ""
SMTP_PORT = ""
SMTP_SECURE = ""                               # "true"/"false" depending on your provider
SMTP_USER = ""
SMTP_PASS = ""

# --- shared email settings (used by whichever provider above is active) ---
SMTP_FROM = ""
SMTP_REPLY_TO = ""
EMAIL_FROM = ""
SENDER_NAME = "Momira Travel"
EMAIL_THROTTLE_MS = ""                         # optional - delay between sends, e.g. "500"
PDF_ATTACHMENT_PATH = ""                       # optional - path to a PDF attached to outreach emails

# --- supplier search tuning (all optional) ---
MIN_SUPPLIER_RATING = ""
MAX_SUPPLIER_RESULTS = ""
MAX_SUPPLIER_CANDIDATES = ""
