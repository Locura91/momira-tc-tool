name: Deploy to server

on:
  push:
    branches:
      - main
      - claude/great-mendel-ypbtm9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/momira-tc-tool
            git pull
            systemctl restart momira-tc.service
sed -i 's/      - main
      - claude/great-mendel-ypbtm9/      - main\n      - claude\/great-mendel-ypbtm9/' /opt/momira-tc-tool/.github/workflows/deploy.yml
sed -i 's/      - main
      - claude/great-mendel-ypbtm9/      - main\n      - claude\/great-mendel-ypbtm9/' /opt/momira-tc-tool/.github/workflows/deploy.yml
